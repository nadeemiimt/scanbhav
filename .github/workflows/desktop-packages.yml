# Build Mac + Windows desktop packages (PyInstaller).
# Artifacts: ScanBhav.app / .dmg / .zip (macOS) and ScanBhav.exe folder zip (Windows).
name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  SCAN_BHAV_VERSION: "0.6.0"

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-packaging.txt
      - name: Build release
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ScanBhav-macOS
          path: |
            dist/release/ScanBhav.app
            dist/release/ScanBhav-macOS-*.dmg
            dist/release/ScanBhav-macOS-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-packaging.txt
      - name: Build release
        shell: pwsh
        run: .\scripts\build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ScanBhav-Windows
          path: |
            dist/release/ScanBhav
            dist/release/ScanBhav-Windows-*.zip
